<div class="fixed bottom-0 left-0 right-0 w-full z-50 px-margin pt-3 pb-safe bg-surface/95 backdrop-blur-md shadow-[0_-4px_20px_rgba(0,34,24,0.12)] border-t border-outline-variant/30 flex flex-col gap-1">
<button class="w-full h-16 min-h-[64px] rounded-xl bg-[#0F382C] text-white font-label-action text-label-action flex items-center justify-center gap-space-sm shadow-lg active:scale-[0.98] transition-all select-none" id="btn-confirm-patrol" type="button" onclick="const curName = document.querySelector('.custodian-btn[aria-checked=&quot;true&quot;]')?.getAttribute('data-name') || 'Víctor Raúl Cárdenas'; const label = document.getElementById('btn-confirm-label'); if(label) label.textContent = 'INICIANDO CON ' + curName.split(' ')[0].toUpperCase() + '...'; this.classList.add('opacity-90', 'pointer-events-none'); setTimeout(() =&gt; { window.location.href = '#durante-recorrido?custodio=' + encodeURIComponent(curName); }, 400);">
<span class="material-symbols-outlined text-[30px]" style="font-variation-settings: &quot;FILL&quot; 1;">directions_walk</span>
<span id="btn-confirm-label" class="">EMPEZAR</span>
<span class="material-symbols-outlined text-[26px]">arrow_forward</span>
</button>

</main>
<script>
  (function initCustodianSelector() {
    const buttons = document.querySelectorAll('.custodian-btn');
    const confirmBtn = document.getElementById('btn-confirm-patrol');
    const confirmLabel = document.getElementById('btn-confirm-label');
    
    let selectedCustodian = "Roberto Mamani Quispe";

    function selectCustodian(selectedBtn) {
      // Deseleccionar todas las burbujas
      buttons.forEach(btn => {
        btn.setAttribute('aria-checked', 'false');
        btn.classList.remove('bg-[#0F382C]', 'text-white', 'shadow-md', 'ring-2', 'ring-primary-fixed-dim');
        btn.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');

        const textSpan = btn.querySelector('.custodian-text');
        if (textSpan) {
          textSpan.classList.remove('text-white');
          textSpan.classList.add('text-on-surface');
        }

        const iconSpan = btn.querySelector('.check-icon');
        if (iconSpan) {
          iconSpan.classList.add('hidden');
          iconSpan.classList.remove('flex');
        }
      });

      // Activar exclusivamente el seleccionado
      selectedBtn.setAttribute('aria-checked', 'true');
      selectedBtn.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
      selectedBtn.classList.add('bg-[#0F382C]', 'text-white', 'shadow-md', 'ring-2', 'ring-primary-fixed-dim');

      const activeTextSpan = selectedBtn.querySelector('.custodian-text');
      if (activeTextSpan) {
        activeTextSpan.classList.remove('text-on-surface');
        activeTextSpan.classList.add('text-white');
      }

      const activeIconSpan = selectedBtn.querySelector('.check-icon');
      if (activeIconSpan) {
        activeIconSpan.classList.remove('hidden');
        activeIconSpan.classList.add('flex');
      }

      selectedCustodian = selectedBtn.dataset.name;

      // Actualizar botón de acción inferior
      if (confirmBtn) {
        confirmBtn.removeAttribute('disabled');
        confirmBtn.classList.remove('opacity-60', 'pointer-events-none');
      }
      if (confirmLabel) {
        confirmLabel.textContent = `CONFIRMAR Y EMPEZAR`;
      }
    }

    // Registrar eventos táctiles y de teclado
    buttons.forEach(btn => {
      btn.addEventListener('click', () => selectCustodian(btn));
      btn.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          selectCustodian(btn);
        }
      });
    });

    // Acción de confirmación con feedback visual
    if (confirmBtn) {
      confirmBtn.addEventListener('click', () => {
        const originalContent = confirmBtn.innerHTML;
        confirmBtn.innerHTML = `
          <span class="material-symbols-outlined text-[28px] animate-spin">progress_activity</span>
          <span>INICIANDO CON ${selectedCustodian.toUpperCase()}...</span>
        `;
        confirmBtn.classList.add('pointer-events-none', 'opacity-90');

        setTimeout(() => {
          alert('Custodio asignado: ' + selectedCustodian + '\\n\\nPatrullaje iniciado con coordenadas GPS activadas.');
          confirmBtn.innerHTML = originalContent;
          confirmBtn.classList.remove('pointer-events-none', 'opacity-90');
        }, 800);
      });
    }
  })();
</script>
