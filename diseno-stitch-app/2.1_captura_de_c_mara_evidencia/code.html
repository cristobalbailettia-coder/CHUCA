<!DOCTYPE html><html lang="es" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2.1 Captura de Cámara - Registro de Evidencia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              dark: '#0F382C',
              primary: '#166534',
              accent: '#22C55E',
              amber: '#F59E0B',
              surface: '#0B1D16'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .shutter-glow:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body class="bg-black text-white h-screen w-full flex flex-col justify-between overflow-hidden select-none">

  <!-- TOP BAR: TELEMETRÍA DE CAMPO Y CANCELAR -->
  <header class="w-full bg-gradient-to-b from-black/90 via-black/60 to-transparent px-4 pt-3 pb-2 z-30 flex items-center justify-between"><div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span><h1 class="text-lg font-extrabold tracking-wide text-white">Fotografía</h1></div><div class="flex items-center gap-3"><button type="button" id="btn-flash" class="w-10 h-10 rounded-full bg-black/60 backdrop-blur-md border border-white/20 flex items-center justify-center text-white active:bg-white/20" title="Flash"><span class="material-symbols-outlined text-xl" id="flash-icon">flash_on</span></button><div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-500/40 text-emerald-300 shadow-inner"><span class="material-symbols-outlined text-lg text-emerald-400">shield</span><span class="text-xs font-black tracking-wider uppercase font-mono">AIDER</span></div></div></header>

  <!-- VISOR DE CÁMARA (VIEWFINDER) -->
  <main class="relative flex-1 w-full overflow-hidden flex items-center justify-center">
    <!-- Imagen del visor en tiempo real -->
    <div class="absolute inset-0 w-full h-full">
      <img id="camera-feed" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBMZXNoFqYUzl1VG68n5jcxzA33wAS7q51W4LyTVvKNnzt0ufIpnkF8eHFspRFTaIIrKMuSFt0D7tfIfAkF0zQCa8qwmTdyZ3CvLoXpTv0i3lWUXwAO23aeFweWXQHOmKqluR3qsaL_O3CzJnXki14nhEkCBCAapFjBT6bUM-V-r_aUIiP4RjjlIfqaF4tBcihFujoVP0l7q_CoNEM6ubiZ96j2EuvIbHlcW7pR4FCBJwVRQLc3y3k_Ng" alt="Visor de cámara en patrullaje" class="w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/30 pointer-events-none"></div>
    </div>

    <!-- Rejilla y marcas de enfoque táctil -->
    <div id="viewfinder-grid" class="absolute inset-6 border border-white/20 rounded-2xl pointer-events-none flex flex-col justify-between p-4">
      <div class="flex justify-between items-start text-[10px] font-mono text-white/70">
        <span class="bg-black/40 px-2 py-0.5 rounded backdrop-blur">HORA: <span id="clock-display" class="">18:42:41</span></span>
        <span class="bg-black/40 px-2 py-0.5 rounded backdrop-blur">CUSTODIO ACTIVO</span>
      </div>

      <!-- Mira central de enfoque -->
      <div class="self-center flex items-center justify-center w-20 h-20 border-2 border-emerald-400/70 rounded-xl relative">
        <div class="w-2 h-2 bg-emerald-400 rounded-full animate-ping"></div>
        <span class="absolute -top-1 -left-1 w-2.5 h-2.5 border-t-2 border-l-2 border-white"></span>
        <span class="absolute -top-1 -right-1 w-2.5 h-2.5 border-t-2 border-r-2 border-white"></span>
        <span class="absolute -bottom-1 -left-1 w-2.5 h-2.5 border-b-2 border-l-2 border-white"></span>
        <span class="absolute -bottom-1 -right-1 w-2.5 h-2.5 border-b-2 border-r-2 border-white"></span>
      </div>

      <div class="flex justify-between items-end text-[10px] font-mono text-white/70">
        <span class="bg-emerald-950/80 text-emerald-300 border border-emerald-500/30 px-2 py-0.5 rounded backdrop-blur">PATRULLA SHIRINGA</span>
        <span class="bg-black/40 px-2 py-0.5 rounded backdrop-blur">FOTO #03</span>
      </div>
    </div>

    <!-- FLASH EFECTO AL TOMAR FOTO -->
    <div id="flash-effect" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-150 z-40"></div>
  </main>

  <!-- PANEL INFERIOR DE ACCIONES Y NOTA OPCIONAL -->
  <footer class="w-full bg-[#0F382C] border-t-2 border-emerald-600/40 p-4 pb-6 z-30 shadow-2xl flex flex-col gap-3"><!-- Botón Disparador Central -->
<div class="w-full flex justify-center items-center py-1">
  <button type="button" id="btn-shutter" class="shutter-glow relative flex items-center justify-center w-20 h-20 rounded-full border-4 border-white bg-white/20 shadow-2xl transition-all active:scale-95" title="Tomar Foto">
    <div class="w-16 h-16 rounded-full bg-white flex items-center justify-center text-emerald-900 shadow-inner">
      <span class="material-symbols-outlined text-3xl font-bold">photo_camera</span>
    </div>
  </button>
</div>

<!-- Botones de Acción: VOLVER (rojo) y GUARDAR (verde) -->
<div class="grid grid-cols-2 gap-3 w-full pt-1">
  <button type="button" id="btn-cancel" class="w-full bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-transform" onclick="window.history.back()">
    <span class="material-symbols-outlined text-2xl">arrow_back</span>
    <span class="text-sm uppercase tracking-wider font-extrabold">VOLVER</span>
  </button>
  <button type="button" id="btn-save" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-lg transition-transform">
    <span class="material-symbols-outlined text-2xl">check_circle</span>
    <span class="text-sm uppercase tracking-wider font-extrabold">GUARDAR</span>
  </button>
</div></footer>

  <!-- NOTIFICACIÓN MODAL DE GUARDADO EXITOSO -->
  <div id="save-toast" class="fixed inset-x-4 top-6 bg-[#0F382C] text-white border-2 border-emerald-400 p-4 rounded-2xl shadow-2xl z-50 flex items-center gap-3 transform -translate-y-32 transition-transform duration-300">
    <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-white shrink-0">
      <span class="material-symbols-outlined text-2xl">done_all</span>
    </div>
    <div class="flex-1">
      <h4 class="text-sm font-bold text-emerald-200">¡Foto guardada con éxito!</h4>
      <p class="text-xs text-white/80">Evidencia vinculada a GPS y guardada en el teléfono. Volviendo al menú...</p>
    </div>
  </div>

  <script>
    // Reloj en tiempo real
    function updateClock() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const min = String(now.getMinutes()).padStart(2, '0');
      const sec = String(now.getSeconds()).padStart(2, '0');
      const display = document.getElementById('clock-display');
      if (display) display.textContent = `${hrs}:${min}:${sec}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const btnShutter = document.getElementById('btn-shutter');
    const flashEffect = document.getElementById('flash-effect');
    const btnSave = document.getElementById('btn-save');
    const btnBack = document.getElementById('btn-back');
    const btnCancel = document.getElementById('btn-cancel');
    const saveToast = document.getElementById('save-toast');
    const photoNote = document.getElementById('photo-note');

    // Efecto de captura
    btnShutter.addEventListener('click', () => {
      flashEffect.style.opacity = '0.9';
      setTimeout(() => {
        flashEffect.style.opacity = '0';
      }, 150);
      btnSave.classList.add('ring-4', 'ring-emerald-400');
    });

    // Guardar evidencia y retorno
    function handleSaveAndReturn() {
      // Mostrar toast animado
      saveToast.classList.remove('-translate-y-32');
      saveToast.classList.add('translate-y-0');

      setTimeout(() => {
        // Redirección de regreso a la pantalla general de 4 botones
        // Se puede navegar a SCREEN_14 si está disponible
        window.history.length > 1 ? window.history.back() : null;
      }, 1200);
    }

    btnSave.addEventListener('click', handleSaveAndReturn);

    // Cancelar y volver
    btnBack.addEventListener('click', (e) => {
      e.preventDefault();
      window.history.back();
    });

    btnCancel.addEventListener('click', () => {
      window.history.back();
    });

    // Toggle flash
    const btnFlash = document.getElementById('btn-flash');
    const flashIcon = document.getElementById('flash-icon');
    let flashOn = true;
    btnFlash.addEventListener('click', () => {
      flashOn = !flashOn;
      flashIcon.textContent = flashOn ? 'flash_on' : 'flash_off';
      btnFlash.classList.toggle('text-amber-300', flashOn);
    });
  </script>






</body></html>
