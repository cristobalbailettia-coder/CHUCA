<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"surface-bright":"#f8f9ff","primary":"#002218","error-container":"#ffdad6","surface-dim":"#d0dbed","inverse-surface":"#27313f","outline-variant":"#c1c8c3","primary-fixed-dim":"#a6d0be","on-secondary-container":"#007233","on-tertiary":"#ffffff","primary-container":"#0f382c","surface-tint":"#3f6658","surface-container-lowest":"#ffffff","on-error-container":"#93000a","on-background":"#121c2a","tertiary-fixed":"#ffdcc3","on-secondary":"#ffffff","outline":"#717975","surface-container-high":"#dee9fc","tertiary-fixed-dim":"#ffb77d","on-tertiary-fixed":"#2f1500","on-primary-fixed":"#002117","on-primary":"#ffffff","on-secondary-fixed":"#00210a","tertiary-container":"#4f2700","primary-fixed":"#c1ecda","secondary-fixed":"#95f8a7","surface":"#f8f9ff","on-surface-variant":"#414845","surface-container":"#e6eeff","on-error":"#ffffff","on-surface":"#121c2a","inverse-primary":"#a6d0be","background":"#f8f9ff","on-tertiary-fixed-variant":"#6e3900","secondary":"#006d30","inverse-on-surface":"#eaf1ff","surface-container-low":"#eff4ff","error":"#ba1a1a","surface-container-highest":"#d9e3f6","secondary-fixed-dim":"#79db8d","on-primary-container":"#79a292","on-secondary-fixed-variant":"#005323","secondary-container":"#92f5a4","on-primary-fixed-variant":"#274e41","surface-variant":"#d9e3f6","on-tertiary-container":"#e48015","tertiary":"#301600"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"space-xl":"2rem","space-sm":"0.75rem","space-xs":"0.5rem","margin":"1.25rem","gutter":"1rem","space-md":"1rem","space-lg":"1.5rem"},"fontFamily":{"label-action":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"label-status":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"body-xl":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"headline-xl":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"]},"fontSize":{"label-action":["22px",{"lineHeight":"28px","letterSpacing":"0.01em","fontWeight":"700"}],"body-sm":["16px",{"lineHeight":"24px","fontWeight":"500"}],"label-status":["16px",{"lineHeight":"22px","letterSpacing":"0.04em","fontWeight":"700"}],"body-md":["18px",{"lineHeight":"28px","fontWeight":"400"}],"body-xl":["22px",{"lineHeight":"32px","fontWeight":"500"}],"headline-lg":["30px",{"lineHeight":"38px","letterSpacing":"-0.01em","fontWeight":"700"}],"body-lg":["20px",{"lineHeight":"30px","fontWeight":"400"}],"headline-xl":["36px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"800"}],"headline-md":["26px",{"lineHeight":"34px","fontWeight":"700"}]}}}};</script><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body><header class="fixed top-0 w-full z-50 pt-safe bg-primary-container shadow-sm border-b border-white/10"><div class="h-14 px-margin flex items-center justify-center relative"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-primary-fixed text-[28px]">forest</span><span class="font-label-action text-[20px] uppercase tracking-wider text-white font-bold">APP CUSTODIO</span></div></div></header><main class="flex flex-col relative w-full flex-grow pt-14 pb-safe bg-primary-container z-10"><div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-5 overflow-hidden"><span class="material-symbols-outlined text-[380px] text-white select-none">park</span></div><div class="flex flex-col w-full h-[calc(100vh-3.5rem)] justify-between px-margin py-space-sm overflow-hidden select-none relative z-20"><div class="flex flex-col gap-space-xs mt-2"><div class="flex items-center gap-space-sm bg-surface-container-lowest p-space-sm rounded-xl shadow-md"><div class="flex flex-col gap-2 w-full"><div class="flex items-center justify-between"></div><div class="flex items-start gap-2.5"><div class="w-10 h-10 rounded-lg bg-primary-container text-primary-fixed flex items-center justify-center shrink-0 mt-0.5"><span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span></div><p class="font-body-md text-primary font-bold text-[16px] leading-snug my-auto">“Cada paso en el patrullaje cuida nuestro bosque y asegura el futuro de nuestra comunidad.”</p></div></div></div><div class="mt-8 text-center"><h2 class="font-headline-lg text-[26px] text-white font-bold tracking-normal leading-snug uppercase">INGRESA A TU COMUNIDAD / COMITÉ DE VIGILANCIA</h2></div></div><form class="flex flex-col gap-space-md my-auto" id="loginForm" onsubmit="event.preventDefault(); handleLogin();"><div class="flex flex-col gap-2"><label class="font-label-action text-[19px] text-white font-bold flex items-center gap-2 tracking-wide" for="pinInput"><span class="material-symbols-outlined text-[24px] text-primary-fixed">pin</span>CÓDIGO (6 DÍGITOS)</label><div class="relative bg-surface-container-lowest rounded-xl shadow-md flex items-center"><input class="w-full h-16 px-4 text-center tracking-[0.45em] font-headline-md text-headline-md text-primary placeholder-outline bg-transparent outline-none font-bold" id="pinInput" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="••••••" required="" type="password" value="842196"><button aria-label="Ver PIN" class="h-16 w-16 flex items-center justify-center shrink-0 text-primary active:scale-95 transition-transform" id="togglePinBtn" onclick="togglePinVisibility()" type="button"><span class="material-symbols-outlined text-[30px]" id="togglePinIcon">visibility</span></button></div></div></form><div class="flex flex-col gap-space-sm shrink-0 pb-2"><a class="w-full h-16 bg-surface-container-lowest text-primary-container rounded-xl flex items-center justify-between px-space-md shadow-lg active:scale-[0.99] transition-all duration-150 font-bold cursor-pointer select-none no-underline" href="#" onclick="event.preventDefault(); window.location.href='{{DATA:SCREEN:SCREEN_9}}';"><span class="w-7"></span><span class="font-label-action text-[22px] uppercase tracking-wider text-primary">INGRESAR</span><span class="material-symbols-outlined text-[32px] text-secondary font-bold">arrow_forward</span></a><a class="w-full py-2.5 px-3 bg-white/10 backdrop-blur-md rounded-lg flex items-center justify-center gap-space-xs text-white active:bg-white/20 transition-colors text-center" href="tel:911"><span class="material-symbols-outlined text-[22px] text-primary-fixed">contact_support</span><span class="font-body-sm text-body-sm font-semibold text-white">¿Olvidó su clave?&nbsp;<br><font color="#c1ecda"><u>Comunicarse con el proveedor</u></font></span></a></div></div><script>
  function togglePinVisibility() {
    const input = document.getElementById('pinInput');
    const icon = document.getElementById('togglePinIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    const pin = document.getElementById('pinInput').value;
    
    if (pin.length < 6) {
      const pinBox = document.getElementById('pinInput');
      pinBox.focus();
      pinBox.parentElement.classList.add('bg-error-container');
      setTimeout(() => {
        pinBox.parentElement.classList.remove('bg-error-container');
      }, 700);
      return;
    }

    const submitBtn = document.querySelector('button[onclick="handleLogin()"]');
    submitBtn.innerHTML = `
      <span class="material-symbols-outlined text-[28px] animate-spin text-secondary">progress_activity</span>
      <span class="font-label-action text-label-action uppercase text-primary">CARGANDO RUTA...</span>
      <span class="w-7"></span>
    `;
    
    setTimeout(() => {
      submitBtn.innerHTML = `
        <span class="w-7"></span>
        <span class="font-label-action text-label-action uppercase text-primary">¡LISTO PARA PATRULLAR!</span>
        <span class="material-symbols-outlined text-[32px] text-secondary">check_circle</span>
      `;
    }, 600);
  }
</script></main>
